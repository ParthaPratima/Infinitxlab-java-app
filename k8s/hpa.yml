apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: infinitx-app-hpa
  namespace: infinitx

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: infinitx-app

  minReplicas: 2
  maxReplicas: 10

  behavior:

    scaleUp:
      stabilizationWindowSeconds: 0

      selectPolicy: Max

      policies:
        - type: Percent
          value: 100
          periodSeconds: 60

        - type: Pods
          value: 4
          periodSeconds: 60


    scaleDown:
      # Wait 5 minutes before scaling down
      # This avoids frequent pod up/down changes
      stabilizationWindowSeconds: 300

      selectPolicy: Max

      policies:
        - type: Percent
          value: 25
          periodSeconds: 60

        - type: Pods
          value: 1
          periodSeconds: 60


  metrics:

    - type: Resource

      resource:
        name: cpu

        target:
          type: Utilization
          averageUtilization: 70
